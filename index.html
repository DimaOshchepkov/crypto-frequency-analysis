<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Online frequency analysis tool for decrypting substitution ciphers. Compare letter frequencies in encrypted text with standard language frequencies (English/Russian) and decode messages interactively.">
<meta name="keywords" content="frequency analysis, cryptography, substitution cipher, decryption, letter frequency, cipher decoder, cryptanalysis">
<meta name="author" content="Frequency Analysis Tool">
<meta name="robots" content="index, follow">
<meta property="og:title" content="Frequency Analysis - Cipher Decryption Tool">
<meta property="og:description" content="Decrypt substitution ciphers using frequency analysis. Compare encrypted text frequencies with standard English or Russian letter frequencies.">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">
<meta property="og:locale:alternate" content="ru_RU">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Frequency Analysis - Cipher Decryption Tool">
<meta name="twitter:description" content="Decrypt substitution ciphers using frequency analysis with interactive letter replacement.">
<title>Frequency Analysis - Cipher Decryption Tool | English & Russian</title>
<link rel="stylesheet" href="styles.css">

<!-- Порядок важен: данные -> i18n -> утилиты -> компонент -> Alpine -->
<script defer src="frequencies.js"></script>
<script defer src="i18n.js"></script>
<script defer src="utils.js"></script>
<script defer src="app.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body>

<div class="crypto" x-data="freqApp" x-cloak @keydown.escape.window="closeModal(); closeVig(); closeAlpha()">
  <h1 class="crypto__title" x-text="t('title')">Cipher Decryption Using Frequency Analysis</h1>

  <!-- Язык -->
  <div class="crypto__section">
    <p class="crypto__section-title" x-text="t('language')">Language</p>
    <div class="crypto__controls">
      <select class="crypto__select" x-model="lang">
        <option value="en">English</option>
        <option value="ru">Russian</option>
      </select>
    </div>
  </div>

  <!-- Ввод -->
  <div class="crypto__section">
    <p class="crypto__section-title" x-text="t('enterText')"></p>
    <textarea class="crypto__input" x-model="input" :placeholder="t('placeholder')"></textarea>
    <div class="crypto__controls" style="margin-top:8px;">
      <button class="crypto__button crypto__button--primary" @click="analyze()" x-text="t('analyze')"></button>
      <button class="crypto__button crypto__button--danger" @click="resetAll()" x-text="t('resetAll')"></button>
    </div>
  </div>

  <!-- Вопрос: это шифротекст Вижинера? -->
  <div class="crypto__section">
    <p class="crypto__vig-question" x-text="t('vigQuestion')"></p>
    <div class="crypto__controls">
      <button class="crypto__button crypto__button--primary" @click="openVig()" x-text="t('vigShow')"></button>
    </div>
  </div>

  <!-- Подбор ключа Вижинера -->
  <div class="crypto__section">
    <p class="crypto__section-title" x-text="t('vigKeyTitle')"></p>
    <p class="crypto__modal-hint" x-show="!cipherText" x-text="t('vigNeedText')"></p>

    <div x-show="cipherText">
      <p class="crypto__modal-hint" x-show="lHint" x-text="vigHintText"></p>
      <div class="crypto__controls">
        <label for="vigL" x-text="t('vigGroupsLabel')"></label>
        <input id="vigL" type="number" min="1" class="crypto__number" x-model="vigL" @keydown.enter="splitIntoGroups()">
        <button class="crypto__button crypto__button--primary" @click="splitIntoGroups()" x-text="t('vigSplit')"></button>
        <button class="crypto__button" @click="openAlpha()" x-text="t('alphaButton')"></button>
      </div>
    </div>

    <template x-if="split">
      <div>
        <div class="crypto__key">
          <b x-text="t('vigKey')"></b>
          <input class="crypto__key-input" spellcheck="false"
                 :value="keyString"
                 @change="setKey($event.target.value); $event.target.value = keyString">
          <span class="crypto__key-shifts" x-text="t('vigKeyShifts') + ': ' + shifts.join(', ')"></span>
        </div>

        <div class="crypto__vigbox">
          <!-- Слева — расшифрованный текст -->
          <div class="crypto__vigbox-text">
            <p class="crypto__section-title" x-text="t('vigDecrypted')"></p>
            <!-- Без пробелов между тегами: у контейнера white-space: pre-wrap -->
            <div class="crypto__text"><template x-for="(s, i) in decrypted" :key="i"><span class="crypto__dec"
                :data-g="i % split.l"
                x-text="show(s)"></span></template></div>
          </div>

          <!-- Справа — по строке на группу: выбор буквы ключа и подсказка по пробелу -->
          <div class="crypto__vigbox-groups">
            <template x-for="(g, j) in split.groups" :key="j">
              <div class="crypto__group-row" @mouseenter="highlightGroup(j)" @mouseleave="highlightGroup(null)">
                <div class="crypto__group-line">
                  <b x-text="t('vigGroup', { j: j + 1 })"></b>
                  <select class="crypto__select" @change="shifts[j] = Number($event.target.value)">
                    <template x-for="(a, s) in orderedAlphabet" :key="s">
                      <option :value="s" :selected="s === shifts[j]" x-text="show(a) + ' (' + s + ')'"></option>
                    </template>
                  </select>
                </div>
                <div class="crypto__group-hint" x-text="groupHint(g)"></div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- Таблицы частот -->
  <div class="crypto__section crypto__row">
    <div class="crypto__col">
      <p class="crypto__section-title" x-text="t('refTable')"></p>
      <table class="crypto__freq-table">
        <thead>
          <tr>
            <th x-text="t('char')"></th><th x-text="t('freq')"></th>
            <th x-text="t('char')"></th><th x-text="t('freq')"></th>
            <th x-text="t('char')"></th><th x-text="t('freq')"></th>
          </tr>
        </thead>
        <tbody>
          <template x-for="(row, r) in refRows" :key="r">
            <tr>
              <template x-for="(cell, c) in row" :key="c">
                <td x-text="cell.text"></td>
              </template>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <div class="crypto__col">
      <p class="crypto__section-title" x-text="t('curTable')"></p>
      <table class="crypto__freq-table">
        <thead x-show="curRows.length">
          <tr>
            <th x-text="t('char')"></th><th x-text="t('freq')"></th>
            <th x-text="t('char')"></th><th x-text="t('freq')"></th>
            <th x-text="t('char')"></th><th x-text="t('freq')"></th>
          </tr>
        </thead>
        <tbody>
          <tr x-show="!curRows.length"><td colspan="6" x-text="t('noData')"></td></tr>
          <template x-for="(row, r) in curRows" :key="r">
            <tr>
              <template x-for="(cell, c) in row" :key="c">
                <td :data-k="cell.symbol" x-text="cell.text"></td>
              </template>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Текущие замены -->
  <div class="crypto__section">
    <p class="crypto__section-title" x-text="t('replacements')"></p>
    <div class="crypto__mapping">
      <span x-show="!mappingList.length" x-text="t('noReplacements')"></span>
      <template x-for="m in mappingList" :key="m.from">
        <div class="crypto__mapping-row">
          <span class="crypto__mapping-from" x-text="show(m.from)"></span>
          <span class="crypto__mapping-arrow">→</span>
          <span class="crypto__mapping-to" x-text="show(m.to)"></span>
          <button class="crypto__button crypto__mapping-undo" @click="undoReplace(m.from)" x-text="t('undo')"></button>
        </div>
      </template>
    </div>
  </div>

  <!-- Текст -->
  <div class="crypto__section">
    <p class="crypto__section-title" x-text="t('textTitle')"></p>
    <!-- Без пробелов между тегами: у контейнера white-space: pre-wrap -->
    <!-- Клик и наведение обрабатываются одним обработчиком на контейнере (делегирование по data-k);
         подсветка переключает класс напрямую в DOM, без реактивного состояния — см. FA.setHighlight. -->
    <div class="crypto__text" @click="openFromEvent($event)" @mouseover="hoverText($event)" @mouseleave="leaveText()"><span x-show="!cipherText">—</span><template x-for="(tok, i) in tokens" :key="i"><span
        :class="{
          'crypto__letter': tok.key !== null,
          'crypto__letter--changed': tok.key !== null && !!mapping[tok.key]
        }"
        :data-k="tok.key"
        :title="tok.key === null ? null : (mapping[tok.key] ? show(tok.key) + ' → ' + show(mapping[tok.key]) : t('clickToReplace', { char: show(tok.key) }))"
        x-text="tok.key === null ? tok.ch : show(mapping[tok.key] || tok.key)"></span></template></div>
  </div>

  <!-- Окно выбора замены -->
  <template x-if="modalData">
    <div class="crypto__modal-backdrop" @click.self="closeModal()">
      <div class="crypto__modal">
        <h3 class="crypto__modal-title" x-text="t('replaceChar', { char: show(modalSymbol) })"></h3>

        <div class="crypto__modal-hint">
          <span x-text="t('freqInText')"></span>
          <b x-text="pct(modalData.curFreq)"></b>.
          <template x-if="modalData.best">
            <span>
              <span x-text="t('bestMatch')"></span>
              <b x-text="show(modalData.best)"></b>
              (<span x-text="pct(refFreq[modalData.best])"></span>).
            </span>
          </template>
          <template x-if="!modalData.best">
            <span x-text="t('allTaken')"></span>
          </template>
        </div>

        <ul class="crypto__modal-list">
          <template x-for="item in modalData.items" :key="item.symbol">
            <li class="crypto__modal-item"
                :class="{ 'crypto__modal-item--best': item.best, 'crypto__modal-item--taken': item.taken }"
                :title="item.taken ? t('taken') : (item.best ? t('best') : '')"
                @click="pickReplacement(item)">
              <span class="crypto__modal-item-letter" x-text="show(item.symbol) + (item.best ? ' ★' : '')"></span>
              <span class="crypto__modal-item-freq" x-text="pct(item.freq)"></span>
            </li>
          </template>
        </ul>

        <div class="crypto__controls" style="margin-top:12px;">
          <button class="crypto__button crypto__button--danger"
                  :disabled="!mapping[modalSymbol]"
                  @click="undoFromModal()" x-text="t('undoReplacement')"></button>
          <button class="crypto__button" @click="closeModal()" x-text="t('close')"></button>
        </div>
      </div>
    </div>
  </template>

  <!-- Окно: алфавит Вижинера -->
  <template x-if="alphaOpen">
    <div class="crypto__modal-backdrop" @click.self="closeAlpha()">
      <div class="crypto__modal crypto__modal--wide">
        <h3 class="crypto__modal-title" x-text="t('alphaTitle')"></h3>
        <p class="crypto__modal-hint" x-text="t('alphaHint')"></p>
        <input class="crypto__key-input crypto__alpha-input" x-model="alphaDraft" @keydown.enter="applyAlpha()" spellcheck="false">
        <div class="crypto__alpha-cells">
          <template x-for="(a, i) in alphaDraftInfo.list" :key="i">
            <div class="crypto__alpha-cell"><b x-text="show(a)"></b><small x-text="i"></small></div>
          </template>
        </div>
        <p class="crypto__modal-hint" x-text="t('alphaSize', { n: alphaDraftInfo.list.length })"></p>
        <p class="crypto__modal-hint" style="color:#c62828" x-show="alphaDraftInfo.error"
           x-text="alphaDraftInfo.error === 'dup' ? t('alphaDup') : t('alphaNoSpace')"></p>
        <div class="crypto__controls">
          <button class="crypto__button crypto__button--primary" :disabled="alphaDraftInfo.error" @click="applyAlpha()" x-text="t('alphaApply')"></button>
          <button class="crypto__button" @click="resetAlpha()" x-text="t('alphaReset')"></button>
          <button class="crypto__button" @click="closeAlpha()" x-text="t('close')"></button>
        </div>
      </div>
    </div>
  </template>

  <!-- Окно: параметры и формулы проверки на Вижинера -->
  <template x-if="vig">
    <div class="crypto__modal-backdrop" @click.self="closeVig()">
      <div class="crypto__modal crypto__modal--wide">
        <h3 class="crypto__modal-title" x-text="t('vigTitle')"></h3>

        <template x-if="vig.tooShort">
          <p class="crypto__modal-hint" x-text="t('vigTooShort')"></p>
        </template>

        <template x-if="!vig.tooShort">
          <div>
            <div class="crypto__vig-basics">
              <span><span x-text="t('vigN')"></span>: <b x-text="vig.n"></b></span>
              <span><span x-text="t('vigAlpha')"></span>: <b x-text="vig.alphabetSize"></b> (<span x-text="t('vigAlphaSpace')"></span>)</span>
            </div>

            <p class="crypto__section-title" x-text="t('vigFormulas')"></p>
            <template x-for="line in vigLines" :key="line.id">
              <div class="crypto__formula">
                <div class="crypto__formula-label" x-text="t(line.id)"></div>
                <div x-text="line.general"></div>
                <div x-show="line.calc" x-text="line.calc"></div>
                <div class="crypto__formula-result" x-text="line.result"></div>
              </div>
            </template>

            <p class="crypto__section-title" x-text="t('vigTable')"></p>
            <p class="crypto__modal-hint" x-text="t('vigThreshold', { value: fmt(vig.threshold) })"></p>
            <table class="crypto__freq-table">
              <thead>
                <tr><th>l</th><th>I_C(l)</th><th></th></tr>
              </thead>
              <tbody>
                <template x-for="row in vig.rows" :key="row.l">
                  <tr :class="{ 'crypto__ic-row--candidate': row.candidate }">
                    <td x-text="row.l"></td>
                    <td x-text="fmt(row.ic)"></td>
                    <td class="crypto__ic-cell"><div class="crypto__ic-bar" :style="{ width: row.width + '%' }"></div></td>
                  </tr>
                </template>
              </tbody>
            </table>

            <p class="crypto__verdict" :class="'crypto__verdict--' + vig.verdict" x-text="vigVerdictText"></p>
          </div>
        </template>

        <div class="crypto__controls" style="margin-top:12px;">
          <button class="crypto__button" @click="closeVig()" x-text="t('close')"></button>
        </div>
      </div>
    </div>
  </template>
</div>

</body>
</html>
